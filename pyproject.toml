[project]
name = "ok-nte"
version = "0.1.0"
description = "An image-recognition-based automation tool for Neverness To Everness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "comtypes>=1.5.0",
    "librosa>=1.0.1",
    "mido>=1.3.3",
    "ok-script[ocr,qt]==3.0.14",
    "onnxocr-ppocrv6==0.0.1",
    "opencc>=1.4.2",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.3.0",
    "psutil>=7.2.2",
    "pynput>=1.8.2",
    "scikit-image>=0.26.0",
    "sounddevice>=0.5.6",
    "typing-extensions>=4.9",
    "pywin32==311",
    "playwright",
]

[dependency-groups]
dev = [
    "mcp==2.3.0",
    "polib>=1.2.0",
    "pytest>=9.2.0",
    "PyInstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
    "Pillow>=13.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-third-party = ["ok"]

[tool.uv]
environments = [
    "sys_platform == 'win32'"
]

override-dependencies = [
    { package = { name = "ok-script" },
      dependencies = ["pyappify==1.0.13"] },
]

exclude-dependencies = [
    { package = { name = "ok-script" },
      dependencies = ["mcp"] },
]
