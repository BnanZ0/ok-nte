name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  SIGN_BUILD: 'true'
  SIGN_SETUP: 'false'
  # Non-empty reuses an existing release EXE; empty builds a new EXE.
  USE_RELEASE: 'https://api.github.com/repos/BnanZ0/ok-nte/releases/tags/v1.3.5'
  SYNC_GITHUB_REPO: 'true'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "110257560+BnanZ0@users.noreply.github.com"
          git config --global user.name "RU"

      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Run tests
        # Keep release and signing credentials out of the test process environment.
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_GH: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_GH',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }
          python -m unittest discover -s tests -p "*test*.py" --top-level-directory . -v 2>&1

      - name: Synchronize update repository
        id: sync
        uses: ok-oldking/partial-sync-repo@bbd55c1dffbcc1292a12295d949e7807b35ea93e
        with:
          repos: |
            https://cnb:${{ secrets.CNB_GH }}@cnb.cool/BnanZ0/ok-nte-update.git
            ${{ env.SYNC_GITHUB_REPO == 'true' && format('https://BnanZ0:{0}@github.com/BnanZ0/ok-nte-update.git', secrets.OK_GH) || '' }}
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

      - name: Check release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      - name: Build portable executable
        id: build_executable
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == ''
        uses: ok-oldking/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_exe_only: true

      - name: Upload unsigned EXE artifact
        id: upload_executable
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: to-sign
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error

      - name: Sign EXE
        id: submit_executable_signing
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '30cc9397-0ebf-4584-8030-12f4b872ecdc'
          project-slug: 'ok-nte'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'single-exe'
          github-artifact-id: '${{ steps.upload_executable.outputs.artifact-id }}'
          wait-for-completion: false

      - name: Approve portable executable signing
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        env:
          SIGNING_REQUEST_ID: ${{ steps.submit_executable_signing.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/30cc9397-0ebf-4584-8030-12f4b872ecdc/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }

          Invoke-RestMethod -Method Post -Uri "$baseUrl/Approve" -Headers $headers -ContentType 'application/json' -Body '{}' -ErrorAction Stop

      - name: Download signed EXE
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        env:
          SIGNING_REQUEST_ID: ${{ steps.submit_executable_signing.outputs.signing-request-id }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          OUTPUT_DIRECTORY: ${{ steps.build_executable.outputs.exe-folder }}
        run: |
          $baseUrl = "https://app.signpath.io/API/v1/30cc9397-0ebf-4584-8030-12f4b872ecdc/SigningRequests/$env:SIGNING_REQUEST_ID"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }

          $deadline = (Get-Date).AddSeconds(60000)
          do {
            $status = Invoke-RestMethod -Uri "$baseUrl/Status" -Headers $headers -ErrorAction Stop
            Write-Host "SignPath status: $($status.status) ($($status.workflowStatus))"

            if ($status.status -eq 'Completed') {
              break
            }
            if ($status.isFinalStatus) {
              throw "SignPath request ended with status '$($status.status)' ($($status.workflowStatus))."
            }
            if ((Get-Date) -ge $deadline) {
              throw 'Timed out waiting for SignPath to sign the EXE.'
            }

            Start-Sleep -Seconds 10
          } while ($true)

          $archivePath = Join-Path $env:RUNNER_TEMP 'signed-executable.zip'
          Invoke-WebRequest -Uri "$baseUrl/SignedArtifact" -Headers $headers -OutFile $archivePath -ErrorAction Stop
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:OUTPUT_DIRECTORY -Force

      - name: Build setup executable from release
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE != ''
        uses: ok-oldking/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_release: ${{ env.USE_RELEASE }}

      - name: Build setup executable
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == ''
        uses: ok-oldking/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned setup executable
        id: upload_setup
        if: steps.release_version.outputs.is_release == 'true' && env.SIGN_SETUP == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: setup-to-sign
          path: pyappify_dist/*setup.exe
          if-no-files-found: error

      - name: Sign setup executables
        if: steps.release_version.outputs.is_release == 'true' && env.SIGN_SETUP == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '30cc9397-0ebf-4584-8030-12f4b872ecdc'
          project-slug: 'ok-nte'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'setupexe'
          github-artifact-id: '${{ steps.upload_setup.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 60000
          output-artifact-directory: pyappify_dist

      - name: Release
        if: steps.release_version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}:
              ${{ steps.sync.outputs.changes_with_asterisk }}
            ### 下载包说明
              * [ok-nte-win32-China-setup.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-China-setup.exe) 完整安装包, 更新使用阿里云+腾讯CNB.
              * [ok-nte-win32-online-setup.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-online-setup.exe) 在线安装包, 在线白嫖的服务器不一定稳定, 建议优先使用完整包.
              * [ok-nte-win32-Global-setup.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-Global-setup.exe) full package with dependencies, using GitHub and PyPi as update source
              * 不要下载ok-nte-win32.zip,和SourceCode.zip, Do Not Download the SourceCode, ok-nte-win32.zip
            ### 如果无法下载或下载慢, 可以使用其他下载源
              * [Mirror酱下载渠道](https://mirrorchyan.com/zh/projects?rid=ok-nte&channel=stable), 国内网页直链, 下载需要购买CD-KEY, 已有Mirror酱CD-KEY可免费下载
              * [百度网盘](https://pan.baidu.com/s/102Mh1djq2B1T-cIJhct9Gg?pwd=okww) 免费下载
              * [夸克网盘](https://pan.quark.cn/s/24433f3febc1) 免费下载
          draft: false
          prerelease: false
          make_latest: true
          files: pyappify_dist/*

      - name: Trigger MirrorChyan workflows
        if: steps.release_version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag=${{ github.ref_name }}
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag=${{ github.ref_name }}
