name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONFAULTHANDLER: '1'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  SIGN_BUILD: 'true'
  SIGN_SETUP: 'false'
  # Set to the final release API URL after preparing its launcher prerelease.
  # An older release URL still reuses its EXE; empty builds a new EXE.
  USE_RELEASE: 'https://api.github.com/repos/BnanZ0/ok-nte/releases/tags/v1.5.0'
  SYNC_GITHUB_REPO: 'true'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "110257560+BnanZ0@users.noreply.github.com"
          git config --global user.name "RU"

      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Prepare release requirements
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Run tests
        # Keep release and signing credentials out of the test process environment.
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_GH: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_GH',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }
          python -X faulthandler -m unittest discover -s tests -p "*test*.py" --top-level-directory . -v 2>&1

      - name: Associate launcher prerelease with the application tag
        if: env.USE_RELEASE == format('https://api.github.com/repos/{0}/releases/tags/{1}', github.repository, github.ref_name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          function Get-Release([string]$tagName) {
            try {
              return Invoke-RestMethod -Uri "$apiRoot/releases/tags/$tagName" -Headers $headers -ErrorAction Stop
            } catch {
              if ($null -ne $_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
                return $null
              }
              throw
            }
          }
          $final = Get-Release $env:RELEASE_TAG
          $staged = Get-Release "pyappify-$env:RELEASE_TAG"
          if ($null -ne $final -and $null -ne $staged) {
            throw 'Both staged and final releases exist; resolve the conflict before building.'
          }
          $release = if ($null -ne $final) { $final } else { $staged }
          if ($null -eq $release) { throw 'No prepared launcher release found.' }
          if ($release.draft -or @($release.assets | Where-Object { $_.name -eq 'ok-nte-win32.zip' }).Count -ne 1) {
            throw 'The release must be published and contain ok-nte-win32.zip.'
          }
          if ($null -ne $staged) {
            if (-not $staged.prerelease -or $staged.immutable) {
              throw 'The prepared launcher must be in a mutable prerelease.'
            }
            $body = @{
              tag_name = $env:RELEASE_TAG
              target_commitish = $env:RELEASE_COMMIT
              name = $env:RELEASE_TAG
            } | ConvertTo-Json
            $updated = Invoke-RestMethod -Method Patch -Uri "$apiRoot/releases/$($staged.id)" -Headers $headers -ContentType 'application/json' -Body $body -ErrorAction Stop
            if ($updated.id -ne $staged.id -or $updated.tag_name -ne $env:RELEASE_TAG) {
              throw 'Unexpected release returned after association.'
            }
          }
          Write-Host "Release $($release.id) is associated with $env:RELEASE_TAG."

      - name: Synchronize update repository
        id: sync
        uses: ok-oldking/partial-sync-repo@bbd55c1dffbcc1292a12295d949e7807b35ea93e
        with:
          repos: |
            https://cnb:${{ secrets.CNB_GH }}@cnb.cool/BnanZ0/ok-nte-update.git
            ${{ env.SYNC_GITHUB_REPO == 'true' && format('https://BnanZ0:{0}@github.com/BnanZ0/ok-nte-update.git', secrets.OK_GH) || '' }}
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

      - name: Check release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$($env:RELEASE_TAG -replace '^v', '')" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $isRelease"

      - name: Build portable executable
        id: build_executable
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == ''
        uses: BnanZ0/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_exe_only: true
          package_mode: frozen

      - name: Upload unsigned EXE artifact
        id: upload_executable
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: to-sign-${{ github.run_attempt }}
          path: ${{ steps.build_executable.outputs.exe-path }}
          if-no-files-found: error

      - name: Sign and approve EXE
        if: steps.release_version.outputs.is_release == 'true' && env.USE_RELEASE == '' && env.SIGN_BUILD == 'true'
        uses: ./.github/actions/sign
        with:
          artifact_id: ${{ steps.upload_executable.outputs.artifact-id }}
          api_token: ${{ secrets.SIGNPATH_API_TOKEN }}
          output_directory: ${{ steps.build_executable.outputs.exe-folder }}

      - name: Build frozen full and body packages
        if: steps.release_version.outputs.is_release == 'true'
        uses: BnanZ0/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          package_mode: frozen
          use_release: ${{ env.USE_RELEASE }}

      - name: Publish frozen full and body packages
        if: steps.release_version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          body: |
            frozen full 和 body 包已上传, 安装器将在构建完成后补充。
          draft: false
          prerelease: true
          make_latest: false
          files: |
            pyappify_dist/*-full.zip
            pyappify_dist/*-body.zip
          fail_on_unmatched_files: true

      - name: Trigger MirrorChyan workflows
        if: steps.release_version.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTE: ${{ steps.sync.outputs.changes_with_asterisk }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f "tag=$RELEASE_TAG"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f "tag=$RELEASE_TAG" -f "release_note=$RELEASE_NOTE"

      - name: Exclude Global setup when GitHub synchronization is disabled
        if: steps.release_version.outputs.is_release == 'true' && env.SYNC_GITHUB_REPO == 'false'
        run: |
          @'
          from pathlib import Path
          import yaml

          config_path = Path("pyappify.yml")
          config = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          config["profiles"] = [profile for profile in config["profiles"] if profile["name"] != "Global"]
          config_path.write_text(yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding="utf-8")
          '@ | uv run --no-project --with pyyaml python -

      - name: Build setup executable
        if: steps.release_version.outputs.is_release == 'true'
        uses: BnanZ0/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          package_mode: setup
          add_version_name: true

      - name: Upload unsigned setup executable
        id: upload_setup
        if: steps.release_version.outputs.is_release == 'true' && env.SIGN_SETUP == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: setup-to-sign-${{ github.run_attempt }}
          path: pyappify_dist/*setup-*.exe
          if-no-files-found: error

      - name: Sign setup executables
        if: steps.release_version.outputs.is_release == 'true' && env.SIGN_SETUP == 'true'
        uses: ./.github/actions/sign
        with:
          artifact_id: ${{ steps.upload_setup.outputs.artifact-id }}
          api_token: ${{ secrets.SIGNPATH_API_TOKEN }}
          artifact_configuration: setupexe
          approve: 'false'
          output_directory: pyappify_dist

      - name: Prepare release notes
        if: steps.release_version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          BODY: |
            ### 简体中文

            #### 更新日志 ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}
              ${{ steps.sync.outputs.changes_with_asterisk }}
            #### 下载包说明
              * [ok-nte-win32-China-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-China-setup-${{ steps.release_version.outputs.version }}.exe) 中国区完整安装包, 更新使用阿里云和腾讯 CNB.
              * [ok-nte-win32-Global-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-Global-setup-${{ steps.release_version.outputs.version }}.exe) Global 完整安装包, 包含运行依赖, 更新使用 GitHub 和 PyPI.
              * [ok-nte-win32-online-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-online-setup-${{ steps.release_version.outputs.version }}.exe) 在线安装包会在安装和更新时下载文件; 免费服务器可能不稳定, 建议优先使用完整包.
              * [ok-nte-win-x86_64-${{ github.ref_name }}-full.zip](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win-x86_64-${{ github.ref_name }}-full.zip) 完整便携压缩包, 包含更新启动器和程序本体. 解压后运行文件夹中的 `ok-nte.exe`. 更新使用 [Mirror酱](https://mirrorchyan.com/zh/get-start), 需要 CD-KEY.
              * [ok-nte-win-x86_64-${{ github.ref_name }}-body.zip](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win-x86_64-${{ github.ref_name }}-body.zip) 程序本体压缩包, 包含运行依赖. 解压后运行 `ok-nte.exe`, 不含更新启动器.
              * 请勿下载 `ok-nte-win32.zip` 或 `SourceCode.zip`.
            #### 其他下载源
              * [Mirror酱](https://mirrorchyan.com/zh/projects?rid=ok-nte-zip&channel=stable) 提供国内网页直链, 下载需要 CD-KEY, 已有 CD-KEY 可免费下载.
              * [百度网盘](https://pan.baidu.com/s/102Mh1djq2B1T-cIJhct9Gg?pwd=okww) 免费下载.
              * [夸克网盘](https://pan.quark.cn/s/24433f3febc1) 免费下载.

            ---

            ### English

            #### What's Changed ${{ steps.sync.outputs.start_tag }} -> ${{ steps.sync.outputs.end_tag }}
              ${{ steps.sync.outputs.changes_with_asterisk }}
            #### Downloads
              * [ok-nte-win32-China-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-China-setup-${{ steps.release_version.outputs.version }}.exe) Full installer for China; updates use Alibaba Cloud and Tencent CNB.
              * [ok-nte-win32-Global-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-Global-setup-${{ steps.release_version.outputs.version }}.exe) Full installer with dependencies; updates use GitHub and PyPI.
              * [ok-nte-win32-online-setup-${{ steps.release_version.outputs.version }}.exe](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win32-online-setup-${{ steps.release_version.outputs.version }}.exe) Online installer that downloads files during installation and updates. Its free hosting servers may be unreliable, so the full installer is recommended.
              * [ok-nte-win-x86_64-${{ github.ref_name }}-full.zip](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win-x86_64-${{ github.ref_name }}-full.zip) Portable package with the update launcher and the app. Extract it and run `ok-nte.exe` from the extracted folder. Updates use [MirrorChyan](https://mirrorchyan.com/zh/get-start); a CD-KEY is required.
              * [ok-nte-win-x86_64-${{ github.ref_name }}-body.zip](https://github.com/BnanZ0/ok-nte/releases/download/${{ github.ref_name }}/ok-nte-win-x86_64-${{ github.ref_name }}-body.zip) App package with runtime dependencies. Extract it and run `ok-nte.exe`. It does not include the update launcher.
              * Do not download `ok-nte-win32.zip` or `SourceCode.zip`.
            #### Alternative Downloads
              * [MirrorChyan](https://mirrorchyan.com/zh/projects?rid=ok-nte-zip&channel=stable) provides direct downloads in China. A CD-KEY is required; existing key holders can download for free.
              * [Baidu Netdisk](https://pan.baidu.com/s/102Mh1djq2B1T-cIJhct9Gg?pwd=okww) Free download.
              * [Quark Drive](https://pan.quark.cn/s/24433f3febc1) Free download.
        run: |
          $content = $env:BODY
          if ($env:SYNC_GITHUB_REPO -eq 'false') {
            $content = $content -replace '(?m)^[ \t]*\* \[ok-nte-win32-Global-setup-[^\r\n]*\r?\n', ''
          }
          [System.IO.File]::WriteAllText('release_body.md', $content)

      - name: Release
        if: steps.release_version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: pyappify_dist/*
          overwrite_files: false
