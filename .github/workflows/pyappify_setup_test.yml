name: Test PyAppify Packages

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Choose which packages to build.
        type: choice
        required: true
        default: mirror
        options:
          - mirror
          - setup
          - all
      push_full_to_mirror_beta:
        description: Upload the full ZIP to MirrorChyan beta (mirror or all only).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-packages:
    name: Build packages with PyAppify Action
    runs-on: windows-latest

    env:
      PYTHON_VERSION: '3.12'
      PYTHONFAULTHANDLER: '1'
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "110257560+BnanZ0@users.noreply.github.com"
          git config --global user.name "RU"

      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: inputs.build_target != 'mirror'
        run: uv pip install --system -r requirements.txt

      - name: Prepare release requirements
        if: inputs.build_target != 'mirror'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Build packages with BnanZ0 PyAppify Action
        uses: BnanZ0/pyappify-action@master
        with:
          package_mode: ${{ inputs.build_target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload China setup executable
        if: inputs.build_target != 'mirror'
        uses: actions/upload-artifact@v7
        with:
          name: setup-China-${{ github.run_number }}
          path: pyappify_dist/ok-nte-win32-China-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Global setup executable
        if: inputs.build_target != 'mirror'
        uses: actions/upload-artifact@v7
        with:
          name: setup-Global-${{ github.run_number }}
          path: pyappify_dist/ok-nte-win32-Global-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload online setup executable
        if: inputs.build_target != 'mirror'
        uses: actions/upload-artifact@v7
        with:
          name: setup-online-${{ github.run_number }}
          path: pyappify_dist/ok-nte-win32-online-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete Mirror ZIP separately
        if: inputs.build_target != 'setup'
        uses: actions/upload-artifact@v7
        with:
          path: pyappify_dist/*-full*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload Mirror body ZIP separately
        if: inputs.build_target != 'setup'
        uses: actions/upload-artifact@v7
        with:
          path: pyappify_dist/*-body*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Prepare MirrorChyan beta upload
        if: inputs.push_full_to_mirror_beta && inputs.build_target != 'setup'
        id: mirror-beta
        shell: pwsh
        run: |
          $fullPackages = @(Get-ChildItem -Path 'pyappify_dist/*-full*.zip' -File)
          if ($fullPackages.Count -ne 1) {
            throw "Expected exactly one full ZIP, found $($fullPackages.Count)"
          }
          "filename=pyappify_dist/$($fullPackages[0].Name)" >> $env:GITHUB_OUTPUT
          # Preload the Action scripts with PowerShell so Windows does not need wget.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/MirrorChyan/uploading-action/refs/heads/v1/python/upload.py' -OutFile 'mirrorchyan_uploading.py'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/MirrorChyan/release-note-action/refs/heads/v1/python/upload.py' -OutFile 'mirrorchyan_release_note.py'
          uv pip install --system requests aiohttp

      - name: Upload full package to MirrorChyan beta
        if: inputs.push_full_to_mirror_beta && inputs.build_target != 'setup'
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: local
          filename: ${{ steps.mirror-beta.outputs.filename }}
          mirrorchyan_rid: ok-nte
          version_name: ${{ github.ref_name }}
          channel: beta
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

      - name: Upload MirrorChyan beta release note
        if: inputs.push_full_to_mirror_beta && inputs.build_target != 'setup'
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: ok-nte
          version_name: ${{ github.ref_name }}
          channel: beta
          release_note: |
            PyAppify full test build: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
